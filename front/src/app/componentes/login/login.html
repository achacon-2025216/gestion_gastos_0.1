<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <h2>Gestion de Gastos</h2>
      <p>Ingresa tus datos para administrar tus gastos</p>
    </div>

    <form class="login-form">
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input type="text" id="email" placeholder="tucorreo@ejemplo.com" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox"> Recuérdame
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu clave?</a>
      </div>

      <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </form>

    <div class="login-footer">
      ¿No tienes una cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </div>
  </div>
</div>
