<div class="registro-wrapper">
  <div class="registro-card">
    <div class="registro-header">
      <div class="icon-container">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </div>
      <h2>Crear Cuenta</h2>
      <p>Comienza a administrar tus finanzas hoy</p>
    </div>

    <form>
      <div class="input-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre y apellido" required />
      </div>

      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="tucorreono@ejemplo.com" required />
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required />
      </div>

      <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <div class="registro-footer">
      ¿Ya tienes una cuenta? <a routerLink="/">Inicia sesión</a>
    </div>
  </div>
</div>
