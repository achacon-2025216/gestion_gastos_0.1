<div class="split-register-wrapper">

  <!-- Lado Izquierdo: Formulario -->
  <div class="register-left-panel">
    <div class="register-card">
      <div class="register-header">
        <div class="logo-container">
          <img src="/img/logo/logo_check.png" alt="Logo GastoCheck">
        </div>
        <h2>Crear cuenta</h2>
        <p>Regístrate para comenzar a controlar tus gastos</p>
      </div>

      <form (submit)="onRegister(); $event.preventDefault()">
        <div class="input-group">
          <label>Nuevo Usuario</label>
          <input type="text" [(ngModel)]="username" name="username" placeholder="Elige un usuario" required />
        </div>

        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
        </div>

        <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
        <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

        <button type="submit" class="btn-submit">Crear cuenta</button>
      </form>

      <div class="register-footer">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
      </div>
    </div>
  </div>

  <!-- Lado Derecho: Logo + Nuevas Ilustraciones y Animaciones -->
  <div class="register-right-panel">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="right-content-wrapper">
      <div class="illustration-container">
        <!-- Elementos originales -->
        <div class="deco check-badge">
          <div class="circle">✓</div>
          <div class="txt">Cuenta creada</div>
        </div>

        <div class="deco profile-card">
          <div class="avatar">🙂</div>
          <div class="name">¡Bienvenido!</div>
          <div class="status">● Todo listo</div>
        </div>

        <div class="deco chip">
          <div class="icon">📊</div>
          <div class="txt">Organiza tus gastos</div>
        </div>

        <div class="deco chip2">
          <div class="icon">🔒</div>
          <div class="txt">Datos protegidos</div>
        </div>

        <!-- Nuevos elementos añadidos -->
        <div class="deco saving-badge">
          <div class="txt">Metas de ahorro</div>
        </div>

        <div class="deco chip3">
          <div class="icon">💡</div>
          <div class="txt">Consejos financieros</div>
        </div>

        <!-- Monedas adicionales -->
        <div class="coin coin1">$</div>
        <div class="coin coin2">$</div>
        <div class="coin coin3">$</div>
        <div class="coin coin4">$</div>
        <div class="coin coin5">$</div>
      </div>
    </div>
  </div>

</div>
